<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Service</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            display: none;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Order Service</h1>

    <p>Kafka Order Notification Demo</p>

</div>


<div class="container">

    <h2>Create Order</h2>

    <label for="userId">
        User ID
    </label>

    <input
            type="text"
            id="userId"
            value="101"
            placeholder="Enter User ID">

    <button onclick="createOrder()">
        Create Order
    </button>

    <div id="result"
         class="result">

    </div>

</div>


<script>

    async function createOrder() {

        const userId =
            document.getElementById("userId").value;

        const result =
            document.getElementById("result");

        result.style.display = "block";

        result.innerHTML =
            "Creating order...";

        try {

            const response =
                await fetch("/api/orders", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        userId: userId
                    })
                });

            if (!response.ok) {

                throw new Error(
                    "HTTP Error: " + response.status
                );
            }

            const order =
                await response.json();

            result.innerHTML = `
                <div class="success">

                    <strong>Order Created Successfully</strong>

                    <br><br>

                    Order ID:
                    ${order.orderId}

                    <br>

                    User ID:
                    ${order.userId}

                    <br>

                    Status:
                    ${order.status}

                    <br>

                    Created:
                    ${order.createdAt}

                </div>
            `;

        } catch (error) {

            console.error(error);

            result.innerHTML = `
                <div class="error">
                    Failed to create order.
                    <br>
                    ${error.message}
                </div>
            `;
        }
    }

</script>

</body>

</html>
