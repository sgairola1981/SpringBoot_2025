<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Notification System</title>

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .connection {
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 20px;
            background: #374151;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 20px;
            color: #111827;
        }

        .order-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .order-result {
            margin-top: 18px;
            padding: 14px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: none;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .notification-count {
            font-size: 14px;
            color: #6b7280;
        }

        #notificationList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification {
            border: 1px solid #e5e7eb;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            padding: 16px;
            background: #ffffff;
            transition: 0.2s;
        }

        .notification:hover {
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .notification.unread {
            background: #eff6ff;
            border-left-color: #2563eb;
        }

        .notification.read {
            opacity: 0.75;
            border-left-color: #9ca3af;
        }

        .notification-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notification-type {
            font-weight: bold;
            color: #1d4ed8;
            font-size: 14px;
        }

        .notification-time {
            font-size: 12px;
            color: #6b7280;
        }

        .notification-message {
            font-size: 15px;
            line-height: 1.5;
            color: #374151;
        }

        .notification-status {
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
        }

        .mark-read-container {
            margin-top: 12px;
        }

        .mark-read-btn {
            padding: 8px 14px;
            font-size: 13px;
        }

        .mark-read-btn.loading {
            opacity: 0.6;
            cursor: wait;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #9ca3af;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .container {
                margin: 15px auto;
                padding: 0 10px;
            }

            .card {
                padding: 18px;
            }

            .notification-title {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>


</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<div class="header">

       <h1>My Order Application 🔔</h1>

    <div id="connectionStatus"
         class="connection">

        🔴 Disconnected

    </div>

</div>

<!-- =========================================================
     MAIN
========================================================= -->

<div class="container">

        <!-- =====================================================
         CREATE ORDER
    ====================================================== -->

    <div class="card">

        <h2>Create Order</h2>

        <div class="order-section">

            <button class="btn-primary"
                    onclick="createOrder()">

                🛒 Create Order

            </button>

            <span>

            User ID:
            <strong id="userIdDisplay"></strong>

        </span>

        </div>


        <div id="orderResult"
             class="order-result">
        </div>


        <div id="errorMessage"
             class="error">
        </div>


        <div id="successMessage"
             class="success">
        </div>

    </div>


    <!-- =====================================================
         NOTIFICATION CARD
    ====================================================== -->

    <div class="card">

        <div class="notification-header">

            <div>

                <h2>
                    Live Notifications 🔔
                </h2>

                <div class="notification-count">

                    Total:
                    <strong id="notificationCount">0</strong>

                    &nbsp;&nbsp;|&nbsp;&nbsp;

                    Unread:
                    <strong id="unreadCount">0</strong>

                </div>

            </div>


            <div class="notification-actions">

                <button class="btn-success"
                        onclick="markAllRead()">

                    ✓ Mark All Read

                </button>


                <button class="btn-secondary"
                        onclick="loadNotifications()">

                    ↻ Refresh

                </button>


                <button class="btn-danger"
                        onclick="clearAll()">

                    🗑 Clear All

                </button>

            </div>

        </div>


        <div id="notificationList">

            <div class="loading">

                Loading notifications...

            </div>

        </div>

    </div>

</div>

<script>

    // =========================================================
    // CONFIGURATION
    // =========================================================

    const USER_ID = "101";

    const NOTIFICATION_SERVICE_URL =
        window.location.origin;

    const ORDER_SERVICE_URL =
        "http://localhost:8081";

    const WEBSOCKET_URL =
        NOTIFICATION_SERVICE_URL + "/ws";

    const DESTINATION =
        "/user/queue/notifications";


    // =========================================================
    // GLOBAL VARIABLES
    // =========================================================

    let stompClient = null;

    let notifications = [];

    let websocketConnected = false;


    // =========================================================
    // PAGE INITIALIZATION
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            document.getElementById(
                "userIdDisplay"
            ).textContent = USER_ID;

            /*
             * IMPORTANT:
             * Mark Read buttons are dynamically generated.
             *
             * Therefore we use event delegation instead
             * of inline onclick.
             */

            document.addEventListener(
                "click",
                function (event) {

                    const button =
                        event.target.closest(
                            ".mark-read-btn"
                        );

                    if (!button) {
                        return;
                    }

                    const id =
                        button.getAttribute(
                            "data-notification-id"
                        );

                    console.log(
                        "================================"
                    );

                    console.log(
                        "MARK READ BUTTON CLICKED"
                    );

                    console.log(
                        "Notification ID:",
                        id
                    );

                    console.log(
                        "================================"
                    );

                    markRead(id, button);

                }
            );

            connectWebSocket();

        }
    );


    // =========================================================
    // WEBSOCKET CONNECTION
    // =========================================================

    function connectWebSocket() {

        updateConnectionStatus(
            "🟡 Connecting...",
            false
        );

        console.log(
            "Connecting WebSocket:",
            WEBSOCKET_URL
        );

        const socket =
            new SockJS(
                WEBSOCKET_URL
            );

        stompClient =
            Stomp.over(socket);

        stompClient.debug = null;

        stompClient.connect(

            {
                userId: USER_ID
            },

            function (frame) {

                console.log(
                    "STOMP CONNECTED:",
                    frame
                );

                websocketConnected = true;

                updateConnectionStatus(
                    "🟢 Connected",
                    true
                );

                console.log(
                    "Subscribing:",
                    DESTINATION
                );

                stompClient.subscribe(

                    DESTINATION,

                    function (message) {

                        console.log(
                            "================================"
                        );

                        console.log(
                            "LIVE NOTIFICATION RECEIVED"
                        );

                        console.log(
                            "Raw message:",
                            message.body
                        );

                        console.log(
                            "================================"
                        );

                        try {

                            const notification =
                                JSON.parse(
                                    message.body
                                );

                            notifications.unshift(
                                notification
                            );

                            notifications =
                                removeDuplicateNotifications(
                                    notifications
                                );

                            renderNotifications();

                        } catch (error) {

                            console.error(
                                "Invalid notification JSON:",
                                error
                            );

                        }

                    }

                );

                loadNotifications();

            },

            function (error) {

                console.error(
                    "WebSocket error:",
                    error
                );

                websocketConnected = false;

                updateConnectionStatus(
                    "🔴 Disconnected",
                    false
                );

                setTimeout(
                    connectWebSocket,
                    3000
                );

            }

        );

    }


    // =========================================================
    // CONNECTION STATUS
    // =========================================================

    function updateConnectionStatus(
        text,
        connected
    ) {

        const element =
            document.getElementById(
                "connectionStatus"
            );

        element.textContent = text;

        if (connected) {

            element.style.background =
                "#166534";

        } else {

            element.style.background =
                "#374151";

        }

    }


    // =========================================================
    // CREATE ORDER
    // =========================================================

    async function createOrder() {

        hideError();
        hideSuccess();

        const result =
            document.getElementById(
                "orderResult"
            );

        result.style.display = "none";

        try {

            console.log(
                "Creating order..."
            );

            const response =
                await fetch(

                    ORDER_SERVICE_URL +
                    "/api/orders",

                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            userId: USER_ID
                        })

                    }

                );

            if (!response.ok) {

                throw new Error(
                    "Order Service returned HTTP " +
                    response.status
                );

            }

            const order =
                await response.json();

            console.log(
                "Order Created:",
                order
            );

            result.innerHTML =
                "✅ Order Created: <strong>" +
                escapeHtml(
                    order.orderId
                ) +
                "</strong>";

            result.style.display =
                "block";

        } catch (error) {

            console.error(
                "Create Order Error:",
                error
            );

            showError(
                "Unable to create order. " +
                error.message
            );

        }

    }


    // =========================================================
    // LOAD NOTIFICATIONS
    // =========================================================

    async function loadNotifications() {

        console.log(
            "Loading notifications..."
        );

        try {

            const url =
                NOTIFICATION_SERVICE_URL +
                "/api/notifications/user/" +
                encodeURIComponent(USER_ID);

            console.log(
                "GET:",
                url
            );

            const response =
                await fetch(url);

            if (!response.ok) {

                throw new Error(
                    "Notification API returned HTTP " +
                    response.status
                );

            }

            const data =
                await response.json();

            console.log(
                "Database notifications:",
                data
            );

            notifications =
                Array.isArray(data)
                    ? data
                    : [];

            notifications =
                removeDuplicateNotifications(
                    notifications
                );

            renderNotifications();

        } catch (error) {

            console.error(
                "Load notifications error:",
                error
            );

            showError(
                "Unable to load notifications. " +
                error.message
            );

        }

    }


    // =========================================================
    // RENDER NOTIFICATIONS
    // =========================================================

    function renderNotifications() {

        const container =
            document.getElementById(
                "notificationList"
            );

        const total =
            notifications.length;

        const unread =
            notifications.filter(
                function (notification) {

                    return !isRead(
                        notification
                    );

                }
            ).length;

        document.getElementById(
            "notificationCount"
        ).textContent = total;

        document.getElementById(
            "unreadCount"
        ).textContent = unread;


        if (total === 0) {

            container.innerHTML = `

                <div class="empty">

                    🔔 No notifications

                </div>

            `;

            return;
        }


        container.innerHTML =
            notifications.map(

                function (notification) {

                    const read =
                        isRead(
                            notification
                        );

                    const type =
                        notification.type ||
                        notification.eventType ||
                        "NOTIFICATION";

                    const message =
                        notification.message ||
                        "No message";

                    const createdAt =
                        notification.createdAt;

                    const orderId =
                        notification.orderId ||
                        "";

                    const notificationId =
                        notification.id;


                    console.log(
                        "Rendering notification:",
                        {
                            id: notificationId,
                            read: notification.read,
                            message: message
                        }
                    );


                    /*
                     * IMPORTANT:
                     *
                     * Do NOT use:
                     *
                     * onclick="markRead(...)"
                     *
                     * Instead use data-notification-id.
                     */

                    const markReadButton =
                        !read &&
                        notificationId !== undefined &&
                        notificationId !== null
                            ?

                        `
                        <div class="mark-read-container">

                            <button
                                type="button"
                                class="btn-secondary mark-read-btn"
                                data-notification-id="${escapeHtml(notificationId)}">

                                ✓ Mark Read

                            </button>

                        </div>
                        `

                            :

                        "";


                    return `

                        <div class="notification
                            ${read ? "read" : "unread"}">

                            <div class="notification-title">

                                <span class="notification-type">

                                    🔔
                                    ${escapeHtml(type)}

                                </span>


                                <span class="notification-time">

                                    ${formatTime(createdAt)}

                                </span>

                            </div>


                            <div class="notification-message">

                                ${escapeHtml(message)}

                            </div>


                            ${
                                orderId
                                ?

                                `
                                <div class="notification-status">

                                    Order:
                                    <strong>
                                        ${escapeHtml(orderId)}
                                    </strong>

                                </div>
                                `

                                :

                                ""
                            }


                            <div class="notification-status">

                                ${
                                    read
                                    ?
                                    "✓ Read"
                                    :
                                    "● Unread"
                                }

                            </div>


                            ${markReadButton}

                        </div>

                    `;

                }

            ).join("");

    }


    // =========================================================
    // MARK SINGLE NOTIFICATION READ
    // =========================================================

    async function markRead(
        id,
        button
    ) {

        console.log(
            "================================"
        );

        console.log(
            "MARK READ"
        );

        console.log(
            "Notification ID:",
            id
        );


        // -----------------------------------------------------
        // Validate ID
        // -----------------------------------------------------

        if (
            id === undefined ||
            id === null ||
            id === "" ||
            id === "undefined" ||
            id === "null"
        ) {

            console.error(
                "Notification ID is missing."
            );

            showError(
                "Notification ID is missing."
            );

            return;
        }


        hideError();


        // -----------------------------------------------------
        // Find notification
        // -----------------------------------------------------

        const notification =
            notifications.find(
                function (item) {

                    return String(item.id) ===
                           String(id);

                }
            );


        console.log(
            "Notification object:",
            notification
        );


        // -----------------------------------------------------
        // EXACT BACKEND URL
        //
        // Controller:
        //
        // @RequestMapping("/api/notifications")
        //
        // @PutMapping("/{id}/read")
        //
        // Result:
        //
        // PUT /api/notifications/{id}/read
        // -----------------------------------------------------

        const url =
            NOTIFICATION_SERVICE_URL +
            "/api/notifications/" +
            encodeURIComponent(id) +
            "/read";


        console.log(
            "PUT URL:",
            url
        );


        try {

            // -------------------------------------------------
            // Disable button while request is running
            // -------------------------------------------------

            if (button) {

                button.disabled = true;

                button.classList.add(
                    "loading"
                );

                button.textContent =
                    "⏳ Marking...";

            }


            // -------------------------------------------------
            // CALL BACKEND
            // -------------------------------------------------

            const response =
                await fetch(

                    url,

                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        }
                    }

                );


            console.log(
                "HTTP STATUS:",
                response.status
            );


            // -------------------------------------------------
            // Controller returns 204 NO CONTENT
            //
            // Therefore DO NOT call response.json()
            // -------------------------------------------------

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    "HTTP " +
                    response.status +
                    (
                        errorText
                        ?
                        " - " + errorText
                        :
                        ""
                    )
                );

            }


            console.log(
                "✅ Backend successfully marked notification as READ."
            );


            // -------------------------------------------------
            // Update local notification
            // -------------------------------------------------

            if (notification) {

                notification.read = true;

            }


            // -------------------------------------------------
            // Re-render screen
            // -------------------------------------------------

            renderNotifications();


            console.log(
                "✅ UI updated."
            );

        } catch (error) {

            console.error(
                "❌ Mark Read Error:",
                error
            );


            if (button) {

                button.disabled = false;

                button.classList.remove(
                    "loading"
                );

                button.textContent =
                    "✓ Mark Read";

            }


            showError(
                "Unable to mark notification as read. " +
                error.message
            );

        }

    }


    // =========================================================
    // MARK ALL READ
    // =========================================================

    async function markAllRead() {

        hideError();

        try {

            const url =
                NOTIFICATION_SERVICE_URL +
                "/api/notifications/user/" +
                encodeURIComponent(USER_ID) +
                "/read-all";


            console.log(
                "PUT:",
                url
            );


            const response =
                await fetch(

                    url,

                    {
                        method: "PUT"
                    }

                );


            console.log(
                "Mark All Read HTTP Status:",
                response.status
            );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    "HTTP " +
                    response.status +
                    (
                        errorText
                        ?
                        " - " + errorText
                        :
                        ""
                    )
                );

            }


            notifications.forEach(
                function (notification) {

                    notification.read =
                        true;

                }
            );


            renderNotifications();


            console.log(
                "✅ All notifications marked as READ."
            );


        } catch (error) {

            console.error(
                "Mark all read error:",
                error
            );


            showError(
                "Unable to mark all notifications as read. " +
                error.message
            );

        }

    }


    // =========================================================
    // CLEAR ALL
    // =========================================================

    async function clearAll() {

        if (
            !confirm(
                "Are you sure you want to clear all notifications?"
            )
        ) {

            return;

        }


        hideError();


        try {

            const url =
                NOTIFICATION_SERVICE_URL +
                "/api/notifications/user/" +
                encodeURIComponent(USER_ID);


            console.log(
                "DELETE:",
                url
            );


            const response =
                await fetch(

                    url,

                    {
                        method: "DELETE"
                    }

                );


            console.log(
                "Clear All HTTP Status:",
                response.status
            );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            notifications = [];

            renderNotifications();


            console.log(
                "✅ All notifications cleared."
            );


        } catch (error) {

            console.error(
                "Clear notifications error:",
                error
            );


            showError(
                "Unable to clear notifications. " +
                error.message
            );

        }

    }


    // =========================================================
    // CHECK READ STATUS
    // =========================================================

    function isRead(notification) {

        return notification.read === true;

    }


    // =========================================================
    // FORMAT DATE/TIME
    // =========================================================

    function formatTime(value) {

        if (!value) {

            return "";

        }


        try {

            const date =
                new Date(value);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return String(value);

            }


            return date.toLocaleString();


        } catch (error) {

            return String(value);

        }

    }


    // =========================================================
    // REMOVE DUPLICATES
    // =========================================================

    function removeDuplicateNotifications(
        list
    ) {

        const seen =
            new Set();


        return list.filter(

            function (notification) {

                /*
                 * Prefer database ID.
                 */

                if (
                    notification.id !== undefined &&
                    notification.id !== null
                ) {

                    const key =
                        "id-" +
                        notification.id;


                    if (
                        seen.has(key)
                    ) {

                        return false;

                    }


                    seen.add(key);

                    return true;

                }


                /*
                 * Fallback.
                 */

                const key =
                    [
                        notification.orderId,
                        notification.type ||
                        notification.eventType,
                        notification.message,
                        notification.createdAt
                    ].join("|");


                if (
                    seen.has(key)
                ) {

                    return false;

                }


                seen.add(key);

                return true;

            }

        );

    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(value);


        return div.innerHTML;

    }


    // =========================================================
    // SHOW ERROR
    // =========================================================

    function showError(message) {

        const element =
            document.getElementById(
                "errorMessage"
            );


        element.textContent =
            "❌ " + message;


        element.style.display =
            "block";

    }


    // =========================================================
    // HIDE ERROR
    // =========================================================

    function hideError() {

        const element =
            document.getElementById(
                "errorMessage"
            );


        element.style.display =
            "none";

    }


    // =========================================================
    // SHOW SUCCESS
    // =========================================================

    function showSuccess(message) {

        const element =
            document.getElementById(
                "successMessage"
            );


        element.textContent =
            "✅ " + message;


        element.style.display =
            "block";

    }


    // =========================================================
    // HIDE SUCCESS
    // =========================================================

    function hideSuccess() {

        const element =
            document.getElementById(
                "successMessage"
            );


        element.style.display =
            "none";

    }

</script>

</body>

</html>
