<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SD Chat</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }
        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }
        .chat-container {
            background: #020617;
            border-radius: 16px;
            padding: 16px;
            height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 80%;
        }
        .user {
            background: #1d4ed8;
            margin-left: auto;
            text-align: right;
        }
        .assistant {
            background: #020617;
            border: 1px solid #1e293b;
            margin-right: auto;
        }
        .input-row {
            display: flex;
            margin-top: 12px;
            gap: 8px;
        }
        .input-row input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 999px;
            border: 1px solid #4b5563;
            background: #020617;
            color: #e5e7eb;
        }
        .input-row button {
            border-radius: 999px;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
            background: #22c55e;
            color: #0f172a;
            font-weight: 600;
        }
        .input-row button.clear {
            background: #ef4444;
            color: white;
        }
        img.generated {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
<div class="page">
    <h2>Stable Diffusion Chat Demo</h2>
    <p>Type a message. To generate an image, start your prompt with <code>image:</code></p>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div th:each="m : ${messages}">
                <div th:class="'bubble ' + (${m.role} == 'user' ? 'user' : 'assistant')">
                    <div th:if="${m.role} == 'user'">
                        <strong>You</strong>
                        <div th:text="${m.text}"></div>
                    </div>
                    <div th:if="${m.role} == 'assistant'">
                        <strong>Assistant</strong>
                        <!-- Render HTML content -->
                        <div th:utext="${m.text}"></div>

                        <!-- If text contains IMG_URL:... also show the image -->
                        <div th:if="${#strings.contains(m.text, 'IMG_URL:')}">
                            <img class="generated"
                                 th:src="${#strings.substringAfter(m.text, 'IMG_URL:')}"
                                 alt="Generated image"/>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form method="post" action="/chat" class="input-row">
            <input type="text" name="question" placeholder="Type a message or: image: a man saying hello" autocomplete="off">
            <button type="submit">Send</button>
        </form>

        <form method="post" action="/clear" class="input-row" style="margin-top: 8px;">
            <button type="submit" class="clear">Clear chat</button>
        </form>
    </div>
</div>

<script>
    // Auto-scroll to bottom
    const messagesDiv = document.getElementById('messages');
    if (messagesDiv) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
