services:
  consul:
    image: hashicorp/consul:1.21
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "8500:8500"
    networks: [microservices]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on: [consul]
    networks: [microservices]

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on: [consul, payment-service]
    networks: [microservices]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    ports:
      - "8085:8085"
    depends_on: [consul, order-service, payment-service]
    networks: [microservices]

  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    environment:
      GATEWAY_URL: http://api-gateway:8085
    ports:
      - "8888:8888"
    depends_on: [api-gateway]
    networks: [microservices]

networks:
  microservices:
    driver: bridge
