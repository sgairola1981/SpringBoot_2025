spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XE
    username: HR
    password: hr
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      maximum-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

app:
  batch:
    chunk-size: 1000