<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Finance AI Agent</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

  <style>

    body{
        background:#eef2f7;
        height:100vh;
        overflow:hidden;
        font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    }

    .chat-card{
        width:100%;
        max-width:1100px;
        height:92vh;
        margin:auto;
        margin-top:20px;
        border:none;
        border-radius:18px;
        overflow:hidden;
        box-shadow:0 10px 35px rgba(0,0,0,.12);
    }

    .chat-header{

        background:linear-gradient(135deg,#0d6efd,#0b5ed7);
        color:white;
        padding:18px 25px;

        display:flex;
        justify-content:space-between;
        align-items:center;

    }

    .header-title{

        display:flex;
        align-items:center;
        gap:15px;

    }

    .header-title i{

        font-size:32px;

    }

    .chat-body{

        background:#f8f9fa;
        overflow-y:auto;
        height:calc(92vh - 160px);
        padding:25px;

    }

    .message{

        display:flex;
        margin-bottom:20px;

    }

    .message.user{

        justify-content:flex-end;

    }

    .message.ai{

        justify-content:flex-start;

    }

    .bubble{

        max-width:78%;
        padding:15px 18px;
        border-radius:18px;
        font-size:15px;
        line-height:1.6;
        white-space:pre-wrap;
        word-break:break-word;
         text-align:left;

    }

    .user .bubble{

        background:#0d6efd;
        color:white;
        border-bottom-right-radius:5px;

    }

    .ai .bubble{

        background:white;
        color:#333;
        border:1px solid #dee2e6;
        border-bottom-left-radius:5px;

    }

    .chat-footer{

        background:white;
        border-top:1px solid #dee2e6;
        padding:15px;

    }

    textarea{

        resize:none;
        border-radius:15px !important;

    }

    .send-btn{

        width:120px;
        height:55px;
        border-radius:15px;

    }

    .typing{

        display:none;
        color:#6c757d;
        margin-bottom:10px;
        font-style:italic;

    }

    .badge-online{

        background:#198754;

    }
    .send-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.spinner-border-sm{
    margin-right:6px;
}

.bubble{
    animation:fadeIn .3s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

  </style>

</head>
<script>

  const txt = document.getElementById("question");

  txt.addEventListener("keydown", function(e){

      if(e.key==="Enter" && !e.shiftKey){

          e.preventDefault();

          sendQuestion();

      }

  });

  txt.addEventListener("input", function(){

      this.style.height="auto";
      this.style.height=this.scrollHeight+"px";

  });

</script>
<body>

<div class="container-fluid">

  <div class="card chat-card">

    <!-- Header -->

    <div class="chat-header">

      <div class="header-title">

        <i class="fa-solid fa-robot"></i>

        <div>

          <h4 class="mb-0">Finance AI Agent</h4>

          <small>Enterprise Finance Investigation Assistant</small>

        </div>

      </div>

      <span class="badge badge-online p-2">

                ● Online

            </span>

    </div>

    <!-- Chat -->

    <div id="chatWindow" class="chat-body">

      <div class="message ai">

        <div class="bubble">

          👋 Welcome!

          I can help you investigate:

          • Voucher Status
          • Workflow Status
          • GST Status
          • Budget Availability
          • Payment Status

          Example:
          "Voucher 52859 status"

        </div>

      </div>

      <div class="typing" id="typing">

        🤖 Finance AI is analysing your request...

      </div>

    </div>

    <!-- Footer -->

    <div class="chat-footer">

      <div class="row">

        <div class="col-md-10">

                    <textarea
                            id="question"
                            rows="2"
                            class="form-control"
                            placeholder="Ask about voucher, payment, GST, workflow..."></textarea>

        </div>

        <div class="col-md-2 d-grid">

          <button
                  class="btn btn-primary send-btn"
                  onclick="sendQuestion()">

            <i class="fa-solid fa-paper-plane"></i>
            Ask AI

          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="/js/chat.js"></script>

<script>

  document.getElementById("question").addEventListener("keydown",function(e){

      if(e.key==="Enter" && !e.shiftKey){

          e.preventDefault();

          sendQuestion();

      }

  });

</script>

</body>
</html>
