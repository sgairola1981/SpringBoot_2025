<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Products</h1>

    <div class="mb-3">
        <a th:href="@{/products/new}" class="btn btn-success">Add Product</a>
    </div>

    <!-- Filter form -->
    <form th:action="@{/products}" method="get" class="row g-3 mb-4">
        <div class="col-md-3">
            <label class="form-label">Search</label>
            <input type="text" class="form-control" name="q"
                   th:value="${request.q}" placeholder="Title / description">
        </div>

        <div class="col-md-2">
            <label class="form-label">Brand</label>
            <select name="brand" class="form-select">
                <option value="">All</option>
                <option th:each="f : ${facets.brandFacets}"
                        th:value="${f.value}"
                        th:text="${f.value}"
                        th:selected="${f.value == request.brand}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                <option value="">All</option>
                <option th:each="f : ${facets.categoryFacets}"
                        th:value="${f.value}"
                        th:text="${f.value}"
                        th:selected="${f.value == request.category}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">Min price</label>
            <input type="number" step="0.01" class="form-control"
                   name="minPrice" th:value="${request.minPrice}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Max price</label>
            <input type="number" step="0.01" class="form-control"
                   name="maxPrice" th:value="${request.maxPrice}">
        </div>

        <div class="col-md-1 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>

        <div class="col-md-2">
            <label class="form-label">Min rating</label>
            <select name="minRating" class="form-select">
                <option value="">Any</option>
                <option value="4" th:selected="${request.minRating == 4}">4+</option>
                <option value="3" th:selected="${request.minRating == 3}">3+</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">In stock</label>
            <select name="inStock" class="form-select">
                <option value="">All</option>
                <option value="true" th:selected="${request.inStock == true}">Yes</option>
                <option value="false" th:selected="${request.inStock == false}">No</option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">Sort</label>
            <select name="sort" class="form-select">
                <option value="relevance" th:selected="${sort == 'relevance'}">Relevance</option>
                <option value="price_asc" th:selected="${sort == 'price_asc'}">Price: Low → High</option>
                <option value="price_desc" th:selected="${sort == 'price_desc'}">Price: High → Low</option>
                <option value="rating_desc" th:selected="${sort == 'rating_desc'}">Rating</option>
            </select>
        </div>
    </form>

    <div class="mb-3 text-muted" th:if="${facets != null}">
        <span th:text="${products.totalElements} + ' results'"></span>
    </div>

    <!-- Product grid -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${products.content}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.title}">Title</h5>
                    <p class="card-text text-muted" th:text="${p.brand} + ' | ' + ${p.category}">Brand | Category</p>
                    <p class="card-text">
                        <strong th:text="${p.price} + ' ₹'">0.00 ₹</strong>
                        <span class="ms-2 text-warning" th:if="${p.rating != null}">
                            ★ <span th:text="${p.rating}">4</span>
                        </span>
                    </p>
                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm">View</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${products.totalPages > 1}" class="mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!products.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number - 1}, size=${products.size},
                                       q=${request.q}, brand=${request.brand}, category=${request.category},
                                       inStock=${request.inStock}, minPrice=${request.minPrice}, maxPrice=${request.maxPrice},
                                       minRating=${request.minRating}, sort=${sort})}">
                    Prev
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/products(page=${i}, size=${products.size},
                                       q=${request.q}, brand=${request.brand}, category=${request.category},
                                       inStock=${request.inStock}, minPrice=${request.minPrice}, maxPrice=${request.maxPrice},
                                       minRating=${request.minRating}, sort=${sort})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${!products.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number + 1}, size=${products.size},
                                       q=${request.q}, brand=${request.brand}, category=${request.category},
                                       inStock=${request.inStock}, minPrice=${request.minPrice}, maxPrice=${request.maxPrice},
                                       minRating=${request.minRating}, sort=${sort})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
