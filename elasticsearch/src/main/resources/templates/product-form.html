<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Add Product</h1>

  <form th:action="@{/products/save}"
        th:object="${product}"
        method="post"
        class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Title</label>
      <input type="text" class="form-control"
             th:field="*{title}"
             th:errorclass="is-invalid">
      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">Title error</div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Brand</label>
      <input type="text" class="form-control"
             th:field="*{brand}"
             th:errorclass="is-invalid">
      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('brand')}"
           th:errors="*{brand}">Brand error</div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Category</label>
      <input type="text" class="form-control"
             th:field="*{category}"
             th:errorclass="is-invalid">
      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('category')}"
           th:errors="*{category}">Category error</div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Price</label>
      <input type="number" step="0.01" class="form-control"
             th:field="*{price}"
             th:errorclass="is-invalid">
      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('price')}"
           th:errors="*{price}">Price error</div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Rating</label>
      <select class="form-select" th:field="*{rating}">
        <option value="">--</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" th:field="*{inStock}">
        <label class="form-check-label">In stock</label>
      </div>
    </div>

    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Save</button>
      <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
