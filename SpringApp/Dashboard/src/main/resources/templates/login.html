<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

       <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background: #f1f3f6;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
        }

        .login-header {
            background: #212529;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px 15px 0 0;
        }

        .login-body {
            padding: 30px;
        }

    </style>


</head>

<body>

<div class="container login-container">


    <div class="card login-card">

        <!-- HEADER -->

        <div class="login-header">

            <h3>Dashboard</h3>

            <small>
                Authentication Server Login
            </small>

        </div>


        <!-- BODY -->

        <div class="login-body">

            <!-- LOGIN ERROR -->

            <div th:if="${error}"
                 class="alert alert-danger">

                <i class="bi bi-exclamation-triangle"></i>

                <span th:text="${error}">
                Invalid username or password.
            </span>

            </div>


            <!-- LOGOUT MESSAGE -->

            <div th:if="${param.logout}"
                 class="alert alert-success">

                You have been logged out.

            </div>


            <!-- LOGIN FORM -->

            <form th:action="@{/login}"
                  method="post">

                <!-- USERNAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                </div>


                <!-- LOGIN BUTTON -->

                <div class="d-grid">

                    <button
                            type="submit"
                            class="btn btn-dark">

                        Login

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
