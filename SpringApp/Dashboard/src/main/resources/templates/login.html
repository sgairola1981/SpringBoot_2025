```html
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Login</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #34495e, transparent 35%),
                linear-gradient(135deg, #111827, #1f2937, #0f172a);
        }

        /* =========================
           LOGIN CONTAINER
        ========================== */

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            width: 430px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.97);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           HEADER
        ========================== */

        .login-header {
            text-align: center;
            color: white;
            padding: 35px 25px 30px;

            background:
                linear-gradient(135deg, #212529, #343a40);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);

            font-size: 30px;
        }

        .login-header h3 {
            margin: 0;
            font-weight: 600;
            letter-spacing: .3px;
        }

        .login-header small {
            display: block;
            margin-top: 8px;
            color: #adb5bd;
            font-size: 13px;
        }

        /* =========================
           BODY
        ========================== */

        .login-body {
            padding: 35px;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-text h5 {
            margin-bottom: 5px;
            font-weight: 600;
            color: #212529;
        }

        .welcome-text p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }

        /* =========================
           FORM
        ========================== */

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #343a40;
        }

        .input-group {
            border-radius: 10px;
            overflow: hidden;
        }

        .input-group-text {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            color: #6c757d;
        }

        .form-control {
            height: 48px;
            border: 1px solid #dee2e6;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #495057;
            box-shadow: 0 0 0 3px rgba(33,37,41,.1);
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            height: 48px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #212529,
                #343a40
            );

            font-weight: 600;
            letter-spacing: .3px;

            transition: all .2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(0,0,0,.25);
        }

        /* =========================
           ALERT
        ========================== */

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        /* =========================
           FOOTER
        ========================== */

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .login-footer small {
            color: #868e96;
        }

        .security-text {
            margin-top: 8px;
            font-size: 12px;
            color: #adb5bd;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                width: 100%;
            }

            .login-body {
                padding: 25px;
            }

        }

    </style>

</head>


<body>

<div class="container-fluid login-container">

    <div class="card login-card">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="login-header">

            <div class="logo">

                <i class="bi bi-shield-lock"></i>

            </div>

            <h3>Dashboard</h3>

            <small>
                Authentication Server
            </small>

        </div>


        <!-- =========================
             BODY
        ========================== -->

        <div class="login-body">


            <!-- WELCOME -->

            <div class="welcome-text">

                <h5>Welcome Back</h5>

                <p>
                    Sign in to continue to your dashboard
                </p>

            </div>


            <!-- LOGIN ERROR -->

            <div th:if="${error}"
                 class="alert alert-danger d-flex align-items-center">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>

                <span th:text="${error}">
                    Invalid username or password.
                </span>

            </div>


            <!-- LOGOUT MESSAGE -->

            <div th:if="${param.logout}"
                 class="alert alert-success d-flex align-items-center">

                <i class="bi bi-check-circle-fill me-2"></i>

                <span>
                    You have been logged out successfully.
                </span>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form th:action="@{/login}"
                  method="post">


                <!-- USERNAME -->

                <div class="mb-4">

                    <label class="form-label">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                        <button
                                type="button"
                                class="btn btn-light border"
                                onclick="togglePassword()">

                            <i
                                    class="bi bi-eye"
                                    id="passwordIcon">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <div class="d-grid">

                    <button
                            type="submit"
                            class="btn btn-dark login-btn">

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Login

                    </button>

                </div>

            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <small>
                    <i class="bi bi-shield-check me-1"></i>
                    Secure Authentication
                </small>

                <div class="security-text">
                    © 2026 Dashboard Application
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     PASSWORD SCRIPT
========================== -->

<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("passwordIcon");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }

</script>

</body>

</html>
```
