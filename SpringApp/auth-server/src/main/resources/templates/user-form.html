<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>User</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header bg-dark text-white">

      <h4 class="mb-0"
          th:text="${mode == 'create'
                    ? 'Create User'
                    : 'Modify User'}">

        Modify User

      </h4>

    </div>

    <div class="card-body">

      <!-- ERROR -->

      <div
              th:if="${error}"
              class="alert alert-danger"
              th:text="${error}">

        Error

      </div>


      <!-- =========================
           CREATE
           ========================= -->

      <form
              th:if="${mode == 'create'}"
              th:action="@{/user/create}"
              method="post">

        <div class="mb-3">

          <label class="form-label">
            Username
          </label>

          <input
                  type="text"
                  name="username"
                  class="form-control"
                  th:value="${user.username}"
                  required>

        </div>


        <div class="mb-3">

          <label class="form-label">
            Password
          </label>

          <input
                  type="password"
                  name="password"
                  class="form-control"
                  required>

        </div>


        <div class="mb-3">

          <label class="form-label">
            Role
          </label>

          <select
                  name="role"
                  class="form-select">

            <option value="USER"
                    th:selected="${user.role == 'USER'}">

              USER

            </option>

            <option value="ADMIN"
                    th:selected="${user.role == 'ADMIN'}">

              ADMIN

            </option>

          </select>

        </div>


        <button
                type="submit"
                class="btn btn-primary">

          Create User

        </button>

        <a
                href="/user/list"
                class="btn btn-secondary">

          Cancel

        </a>

      </form>


      <!-- =========================
           UPDATE
           ========================= -->

      <form
              th:if="${mode == 'edit'}"
              th:action="@{/user/update}"
              method="post">

        <input
                type="hidden"
                name="id"
                th:value="${user.id}">


        <div class="mb-3">

          <label class="form-label">
            Username
          </label>

          <input
                  type="text"
                  name="username"
                  class="form-control"
                  th:value="${user.username}"
                  required>

        </div>


        <div class="mb-3">

          <label class="form-label">

            New Password

            <small class="text-muted">
              (leave blank to keep existing password)
            </small>

          </label>

          <input
                  type="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter new password">

        </div>


        <div class="mb-3">

          <label class="form-label">
            Role
          </label>

          <select
                  name="role"
                  class="form-select">

            <option
                    value="USER"
                    th:selected="${user.role == 'USER'}">

              USER

            </option>

            <option
                    value="ADMIN"
                    th:selected="${user.role == 'ADMIN'}">

              ADMIN

            </option>

          </select>

        </div>


        <div class="form-check mb-4">

          <input
                  type="checkbox"
                  name="enabled"
                  value="true"
                  class="form-check-input"
                  th:checked="${user.enabled}">

          <label class="form-check-label">
            Account Enabled
          </label>

        </div>


        <button
                type="submit"
                class="btn btn-success">

          Save Changes

        </button>

        <a
                href="/user/list"
                class="btn btn-secondary">

          Cancel

        </a>

      </form>

    </div>

  </div>

</div>

</body>

</html>
