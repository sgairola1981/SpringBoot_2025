<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Authentication Server</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <style>

    body {
        background: #f1f3f6;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        width: 420px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    .header {
        background: #212529;
        color: white;
        text-align: center;
        padding: 25px;
        border-radius: 16px 16px 0 0;
    }

    .body {
        padding: 30px;
    }

  </style>

</head>

<body>

<div class="container login-container">

  <div class="card login-card">

    <div class="header">

      <h3>Authentication Server</h3>

      <small>
        Secure Login
      </small>

    </div>

    <div class="body">

      <div
              th:if="${param.error}"
              class="alert alert-danger">

        Invalid username or password.

      </div>

      <div
              th:if="${param.logout}"
              class="alert alert-success">

        Successfully logged out.

      </div>

      <form
              th:action="@{/login}"
              method="post">

        <div class="mb-3">

          <label class="form-label">
            Username
          </label>

          <input
                  type="text"
                  name="username"
                  class="form-control"
                  required>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Password
          </label>

          <input
                  type="password"
                  name="password"
                  class="form-control"
                  required>

        </div>

        <div class="d-grid">

          <button
                  type="submit"
                  class="btn btn-dark">

            Login

          </button>

        </div>

      </form>

    </div>

  </div>

</div>

</body>

</html>
