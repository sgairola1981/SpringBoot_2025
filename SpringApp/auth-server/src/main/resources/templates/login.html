<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>


  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Authentication Server</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <style>

    body {
        background: #f1f3f6;
    }

    .login-container {
        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;
    }

    .login-card {
        width: 400px;

        border: none;

        border-radius: 15px;

        box-shadow:
            0 5px 25px
            rgba(0,0,0,.15);
    }

    .header {
        background: #212529;

        color: white;

        text-align: center;

        padding: 25px;

        border-radius:
            15px 15px 0 0;
    }

    .body {
        padding: 30px;
    }

    .create-user {
        margin-top: 20px;

        padding-top: 20px;

        border-top: 1px solid #dee2e6;
    }

  </style>


</head>

<body>

<div class="container login-container">


  <div class="card login-card">


    <!-- HEADER -->

    <div class="header">

      <h3>
        Authentication Server
      </h3>

      <small>
        Secure Login
      </small>

    </div>


    <!-- BODY -->

    <div class="body">


      <!-- ERROR -->

      <div
              th:if="${param.error}"
              class="alert alert-danger">

        Invalid username or password.

      </div>


      <!-- LOGOUT -->

      <div
              th:if="${param.logout}"
              class="alert alert-success">

        You have been logged out.

      </div>


      <!-- LOGIN FORM -->

      <form
              th:action="@{/login}"
              method="post">


        <!-- USERNAME -->

        <div class="mb-3">

          <label class="form-label">
            Username
          </label>

          <input
                  type="text"
                  name="username"
                  class="form-control"
                  placeholder="Enter username"
                  required>

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

          <label class="form-label">
            Password
          </label>

          <input
                  type="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter password"
                  required>

        </div>


        <!-- LOGIN BUTTON -->

        <div class="d-grid">

          <button
                  type="submit"
                  class="btn btn-dark">

            Login

          </button>

        </div>


      </form>


      <!-- CREATE USER -->

      <div class="create-user text-center">

        <div class="text-muted mb-2">

          Don't have an account?

        </div>

        <a
                th:href="@{/create}"
                class="btn btn-outline-primary w-100">

          Create New User

        </a>

      </div>


    </div>

  </div>

</div>

</body>

</html>
