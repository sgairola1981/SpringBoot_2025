<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create User</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

  <div class="card shadow"
       style="max-width:500px; margin:auto;">

    <div class="card-header">

      <h4 class="mb-0">
        Create User
      </h4>

    </div>

    <div class="card-body">

      <!-- SUCCESS -->

      <div th:if="${success}"
           class="alert alert-success">

        <span th:text="${success}"></span>

      </div>


      <!-- ERROR -->

      <div th:if="${error}"
           class="alert alert-danger">

        <span th:text="${error}"></span>

      </div>


      <form th:action="@{/user/create}"
            method="post">


        <!-- USERNAME -->

        <div class="mb-3">

          <label class="form-label">
            Username
          </label>

          <input type="text"
                 name="username"
                 class="form-control"
                 required>

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

          <label class="form-label">
            Password
          </label>

          <input type="password"
                 name="password"
                 class="form-control"
                 required>

        </div>


        <!-- ROLE -->

        <div class="mb-3">

          <label class="form-label">
            Role
          </label>

          <select name="role"
                  class="form-select">

            <option value="USER">
              USER
            </option>

            <option value="ADMIN">
              ADMIN
            </option>

          </select>

        </div>


        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-primary">

          Create User

        </button>

      </form>

    </div>

  </div>

</div>

</body>

</html>
