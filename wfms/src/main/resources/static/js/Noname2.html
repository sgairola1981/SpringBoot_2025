{

      document.forms[0].EMP_ID.disabled=false;
      document.forms[0].EMP_NAME.disabled=false;
      document.forms[0].ORG_CD.disabled=false;

      document.forms[0].UNIT_CD.disabled=false;

   }
   if (document.forms[0].REC_TYP.value=='05')
   {
      document.forms[0].ORG_CD.value='';
      document.forms[0].CIRCLE_CD.value='';
      document.forms[0].UNIT_CD.value='';

	  document.forms[0].EMP_ID.disabled=false;
      document.forms[0].EMP_NAME.disabled=true;
	  document.forms[0].LOV_DISABLED.value='T';
   }
   if (document.forms[0].REC_TYP.value=='03')
   {
      document.forms[0].ORG_CD.value='';
      document.forms[0].CIRCLE_CD.value='';
      document.forms[0].UNIT_CD.value='';

	  document.forms[0].EMP_ID.disabled=false;
      document.forms[0].EMP_NAME.disabled=true;	  document.forms[0].LOV_DISABLED.value='T';
   }
}

{
   if(mode!=null)
      if(document.forms[0].REC_TYP.value=='intr_amt')

       }
      else if(document.forms[0].REC_TYP.value=='dli_amt')
        {
        }
      else if(document.forms[0].REC_TYP.value=='finl_wd')
      {
         fn_lov(mode);
      }
}

function fn_lov(mode)
{
	if(document.forms[0].LOV_DISABLED.value!='T')
	{
		if(mode=='O')
		{
				window.parentfield=document.forms[0]['ORG_CD'];
				window.parentfield1=document.forms[0]['ORG_DSCR'];
				var winPopup = window.open("ccalov.jsp?name=ORG&title=Organisations&fn=1&mValue=",'winSearch','scrollbars=no,dependent=yes,top=50,left=100,resizeable=yes,width=500,height=400');
		}
		else if(mode=='C')
		{
				window.parentfield=document.forms[0]['CIRCLE_CD'];
				window.parentfield1=document.forms[0]['CIRCLE_DSCR'];
				var winPopup = window.open("ccalov.jsp?name=CIRC&title=Circles&fn=1&mValue=",'winSearch','scrollbars=no,dependent=yes,top=50,left=100,resizeable=yes,width=500,height=400');
		}
		else if(mode=='U')
		{
				window.parentfield=document.forms[0]['UNIT_CD'];
				window.parentfield1=document.forms[0]['UNIT_DSCR'];
				var winPopup = window.open("ccalov.jsp?name=UNIT&title=Units&fn=1&mValue=",'winSearch','scrollbars=no,dependent=yes,top=50,left=100,resizeable=yes,width=500,height=400');
		}
	}
}
function clearDepFields()
{
}
function fn_bdLd()
{
   window.status=document.forms[0].ret_msg.value;
	var timVar=setTimeout("window.status='';",10000);
  	var tf=document.forms[0];
   if(tf.OSD_FLAG.value=='Y')
	{
		tf.EMP_ID.disabled=true;
	}
   document.forms[0].REC_TYP.value=document.forms[0].REC_TYP_VAL.value;
}
function Fn_run(){
   if(!validRequired(document.forms[0].REC_TYP,"Please select a process type to be run!!!"))
   {
		document.forms[0].REC_TYP.select();
	    return false;
	   }

   if(document.forms[0].REC_TYP.value=='12')
      //      this is for interest amount
   {
      document.forms[0].actionFlag.value = 'GPF_INTR_PROCSSearch';
      document.forms[0].ims_flag.value = 'IA';
      document.forms[0].target='MAINIFRAME';
      document.forms[0].submit();
   }
   else if(document.forms[0].REC_TYP.value=='05')
//      this is for dli
   {
	  if(!validRequired(document.forms[0].EMP_ID,"Employee Id is required for DLI amount!!"))
	  return false; 
		  
	  
      document.forms[0].actionFlag.value = 'GPF_INTR_PROCSSearch';
      document.forms[0].ims_flag.value = 'DL';
      document.forms[0].target='MAINIFRAME';
      document.forms[0].submit();
   }
   else if(document.forms[0].REC_TYP.value=='03')
      //      this is for final withdrawal
   {
	  if(!validRequired(document.forms[0].EMP_ID,"Employee Id is required for Final Withdrawal!!"))
		  return false;

	  document.forms[0].actionFlag.value = 'GPF_INTR_PROCSSearch';
      document.forms[0].ims_flag.value = 'FW';
      document.forms[0].target='MAINIFRAME';
      document.forms[0].submit();
   }
  
}
function resetValues()
{
	document.forms[0].EMP_ID.value="";
	document.forms[0].EMP_NAME.value="";
	document.forms[0].ORG_DSCR.value="";
	document.forms[0].ORG_CD.value="";
	document.forms[0].CIRCLE_DSCR.value="";
	document.forms[0].CIRCLE_CD.value="";
	document.forms[0].UNIT_DSCR.value="";
	document.forms[0].UNIT_CD.value="";
   document.forms[0].REC_TYP.value="";
}
